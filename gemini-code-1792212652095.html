<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero Automático</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .atm { background: white; padding: 20px; border-radius: 16px; border: 3px solid #0284c7; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
        .screen { background: #f8fafc; border: 2px solid #cbd5e1; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .pin-input { font-size: 2rem; letter-spacing: 10px; text-align: center; width: 80%; padding: 10px; border: 2px solid #0284c7; border-radius: 8px; margin: 15px 0; outline: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; }
        .btn-ok { background: #16a34a; }
        .btn-danger { background: #ef4444; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid button { padding: 16px 0; font-weight: bold; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1.3rem; }
        .grid button:active { background: #0284c7; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="atm">
    <h2 style="color: #0284c7; margin-top: 0;">BANCO FÁCIL</h2>
    
    <div class="screen">
        <!-- 1. PANTALLA PIN -->
        <div id="pantalla-pin">
            <p style="margin: 0; font-weight: bold;">Ingrese su PIN</p>
            <p style="font-size: 0.85rem; color: #64748b; margin: 4px 0;">(Clave: 1234)</p>
            
            <!-- Campo de texto real -->
            <input type="password" id="pin-field" class="pin-input" maxlength="4" placeholder="••••" readonly>
            
            <button class="btn btn-ok" type="button" onclick="probarPin()">INGRESAR (OK)</button>
        </div>

        <!-- 2. PANTALLA MENÚ -->
        <div id="pantalla-menu" class="hidden">
            <p style="font-weight: bold;">Saldo: <span id="txt-saldo" style="color:#16a34a">$1,000.00</span></p>
            <button class="btn" type="button" onclick="hacerRetiro()">Retirar $100</button>
            <button class="btn" type="button" onclick="hacerDeposito()">Depositar $100</button>
            <button class="btn btn-danger" type="button" onclick="cerrarSesion()">Salir</button>
        </div>
    </div>

    <!-- TECLADO NUMÉRICO FÍSICO EN PANTALLA -->
    <div class="grid" id="teclado">
        <button type="button" onclick="num('1')">1</button>
        <button type="button" onclick="num('2')">2</button>
        <button type="button" onclick="num('3')">3</button>
        <button type="button" onclick="num('4')">4</button>
        <button type="button" onclick="num('5')">5</button>
        <button type="button" onclick="num('6')">6</button>
        <button type="button" onclick="num('7')">7</button>
        <button type="button" onclick="num('8')">8</button>
        <button type="button" onclick="num('9')">9</button>
        <button type="button" onclick="limpiar()" style="color:#ef4444;">C</button>
        <button type="button" onclick="num('0')">0</button>
        <button type="button" onclick="probarPin()" style="color:#16a34a;">OK</button>
    </div>
</div>

<script>
    var input = document.getElementById('pin-field');
    var saldo = 1000;

    function num(n) {
        if (input.value.length < 4) {
            input.value = input.value + n;
        }
    }

    function limpiar() {
        input.value = '';
    }

    function probarPin() {
        if (input.value === '1234') {
            document.getElementById('pantalla-pin').className = 'hidden';
            document.getElementById('teclado').className = 'hidden';
            document.getElementById('pantalla-menu').className = '';
        } else {
            alert('PIN incorrecto. Pruebe con 1234');
            limpiar();
        }
    }

    function hacerRetiro() {
        if (saldo >= 100) {
            saldo -= 100;
            document.getElementById('txt-saldo').innerText = '$' + saldo.toFixed(2);
            alert('Retiro exitoso de $100');
        } else {
            alert('Saldo insuficiente');
        }
    }

    function hacerDeposito() {
        saldo += 100;
        document.getElementById('txt-saldo').innerText = '$' + saldo.toFixed(2);
        alert('Depósito exitoso de $100');
    }

    function cerrarSesion() {
        limpiar();
        document.getElementById('pantalla-menu').className = 'hidden';
        document.getElementById('pantalla-pin').className = '';
        document.getElementById('teclado').className = 'grid';
    }
</script>

</body>
</html>
